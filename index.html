<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Commit">
<meta name="theme-color" content="#0d1117">
<meta name="format-detection" content="telephone=no">
<title>Commit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script>
/* set the saved theme before first paint to avoid a dark flash */
try {
  var s = JSON.parse(window.localStorage.getItem('commit.v1'));
  if (s && s.settings && s.settings.theme === 'light') { document.documentElement.setAttribute('data-theme', 'light'); }
} catch (e) {}
</script>
</head>
<body>
<div id="app"></div>

<nav id="tabs">
  <button class="tab" data-act="tab" data-tab="home">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Home</span>
    <i class="badge" id="home-badge" style="display:none"></i>
  </button>
  <button class="tab" data-act="tab" data-tab="commit">
    <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Commit</span>
  </button>
  <button class="tab" data-act="tab" data-tab="spend">
    <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="6" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" stroke="currentColor" stroke-width="2"/><circle cx="16.5" cy="14.5" r="1.4" fill="currentColor"/></svg>
    <span>Expenses</span>
  </button>
</nav>

<div id="sheet-root"></div>
<div id="toast-root"></div>
<div id="setup-root"></div>
<script src="app.js"></script>
</body>
</html>
